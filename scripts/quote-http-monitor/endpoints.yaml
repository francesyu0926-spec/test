# CBD 行情 HTTP 接口监控清单（来源：《行情系统监控及维护》）
# 默认仅在 09:00–23:39（Asia/Shanghai）执行；not_before 可推迟单接口开始时间。

base_url: "https://terminal.sfccn.com/terminal/quotes"

# 文档联系人（告警路由可自行对接 webhook）
default_contact: "高德建"

default_fields: &default_fields
  - code
  - name
  - spe
  - PBR
  - pe
  - amount
  - turnoverRate
  - threeMinRise
  - lastPrice
  - preClosePrice
  - fiveMinRise

endpoints:
  - name: quote
    description: 实时行情查询
    enabled: true
    body:
      code: "300006.SZ"
      field: "1"
      fields: *default_fields
      pageIndex: 0
      pageSize: 5

  - name: line
    description: 当日分时
    enabled: true
    not_before: "09:30"
    body:
      marketId: "XSHE"
      code: "300006.SZ"

  - name: line5d
    description: 5日分时
    enabled: true
    body:
      code: "300006.SZ"
      requestType: 1
      subtype: ""
      datetime: "19900101000000"
      mode: 0

  - name: astocksquote
    description: 涨跌幅统计
    enabled: true
    not_before: "09:30"
    body:
      code: "600070.SH"

  - name: catesorting
    description: 分类排行
    enabled: true
    body:
      code: "9E341731AEDFB798E050A8C05B01C2B2"
      field: "1"
      fields: *default_fields
      pageIndex: 0
      pageSize: 5

  - name: m1
    description: 1分钟K线
    enabled: true
    body:
      code: "300006.SZ"
      requestType: 1
      subtype: ""
      datetime: "19900101000000"
      mode: 0

  - name: m5
    description: 5分钟K线
    enabled: true
